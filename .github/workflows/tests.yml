name: backend-tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Test with pytest
        run: uv run pytest --junitxml=junit.xml -o junit_family=legacy --cov=datastew --cov-report=xml

      - name: Lint with flake8
        run: |
          uv tool run flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          uv tool run flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
